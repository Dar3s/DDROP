services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddrop_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: dropshipping_app
      DB_USER: ddrop_user
      DB_PASS: ddrop_password
    depends_on:
      - db
    volumes:
      - .:/var/www/html
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: ddrop_db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: dropshipping_app
      MARIADB_USER: ddrop_user
      MARIADB_PASSWORD: ddrop_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

volumes:
  db_data:
