services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dropshipping_app
      DB_USER: ddrop_user
      DB_PASS: ddrop_password
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dropshipping_app
      POSTGRES_USER: ddrop_user
      POSTGRES_PASSWORD: ddrop_password
