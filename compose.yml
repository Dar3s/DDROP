services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dropshipping_app
      DB_USER: ddrop_user
      DB_PASS: ddrop_demo_password

      OPENAI_BASE_URL: https://example.com/v1
      OPENAI_API_KEY: demo_key
      OPENAI_MODEL: gemma3:27b

    depends_on:
      - db

    restart: unless-stopped

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: dropshipping_app
      POSTGRES_USER: ddrop_user
      POSTGRES_PASSWORD: ddrop_demo_password

    restart: unless-stopped
