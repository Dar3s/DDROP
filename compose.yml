services:
  web:
    build: .
    container_name: ddrop_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ddrop
      DB_USER: ddrop_user
      DB_PASS: example_password
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: ddrop_db
    environment:
      POSTGRES_DB: ddrop
      POSTGRES_USER: ddrop_user
      POSTGRES_PASSWORD: example_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data:
