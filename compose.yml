services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dropshipping_app}
      DB_USER: ${DB_USER:-ddrop_user}
      DB_PASS: "${DB_PASS:-}"

      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: ${OPENAI_MODEL:-gemma3:27b}

    depends_on:
      - db

    restart: unless-stopped

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${DB_NAME:-dropshipping_app}
      POSTGRES_USER: ${DB_USER:-ddrop_user}
      POSTGRES_HOST_AUTH_METHOD: trust

    restart: unless-stopped
